# הגדרת פריסה ל-Render — שני שירותים: backend (FastAPI) + frontend (Vite כאתר סטטי).
# preDeployCommand מריץ את המיגרציות אוטומטית לפני כל deploy של ה-backend.
services:
  - type: web
    name: developers-marketplace-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # DATABASE_URL — connection string של Postgres מ-Supabase (פורמט asyncpg)
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: AVATAR_BUCKET
        value: avatars
      - key: MAX_AVATAR_BYTES
        value: "5242880"
      # ALLOWED_ORIGINS — דומייני הפרונט (פסיק מפריד), למשל https://app.example.com
      - key: ALLOWED_ORIGINS
        sync: false
      - key: WA_GREETING
        sync: false

  # --- פרונט: Vite SPA כאתר סטטי ---
  - type: web
    name: developers-marketplace-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # כתובת ה-backend (build-time). VITE_USE_MOCK לא מוגדר → ברירת מחדל false → API אמיתי.
      # הגדר לכתובת שירות ה-API, למשל: https://developers-marketplace-api.onrender.com
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # SPA rewrite — כל נתיב מוגש דרך index.html, כדי ש-/dev/:id, /match, /join יעבדו ב-refresh/deep-link
      - type: rewrite
        source: /*
        destination: /index.html
