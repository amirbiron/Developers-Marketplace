# הגדרות Alembic. כתובת ה-DB נטענת ב-env.py מ-DATABASE_URL (לא מכאן).
[alembic]
script_location = alembic
prepend_sys_path = .
# placeholder — נדרס ב-env.py מההגדרות של האפליקציה
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/marketplace

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
